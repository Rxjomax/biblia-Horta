<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="oceanBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#193A69" />
      <stop offset="52%" stop-color="#13294B" />
      <stop offset="100%" stop-color="#0B192E" />
    </linearGradient>
    <radialGradient id="atlanticGlow" cx="256" cy="215" r="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#275594" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#13294B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="nobleGold" x1="256" y1="90" x2="256" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECCB7B" />
      <stop offset="50%" stop-color="#D4A84E" />
      <stop offset="100%" stop-color="#B8862D" />
    </linearGradient>
    <linearGradient id="whaleSeafoam" x1="256" y1="138" x2="256" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="48%" stop-color="#EDF6FC" />
      <stop offset="76%" stop-color="#B7DCF6" />
      <stop offset="100%" stop-color="#64AEE2" />
    </linearGradient>
  </defs>

  <!-- Deep Atlantic Navy app backdrop -->
  <rect width="512" height="512" rx="108" fill="url(#oceanBg)" />
  <rect width="512" height="512" rx="108" fill="url(#atlanticGlow)" />
  <rect x="20" y="20" width="472" height="472" rx="90" stroke="#D4A84E" stroke-opacity="0.24" stroke-width="3" />

  <!-- IEBH Emblem transformed cleanly from 631x646 original (center 316, 324 -> 256, 256, scale 0.775) -->
  <g transform="translate(256 256) scale(0.775) translate(-316 -324)">
    <!-- Noble Gold Cross (behind whale fluke) -->
    <g fill="url(#nobleGold)">
      <!-- Vertical beam -->
      <rect x="282" y="68" width="68" height="410" rx="8" />
      <!-- Horizontal beam -->
      <rect x="128" y="208" width="376" height="68" rx="8" />
    </g>

    <!-- Whale Fluke & Tail Stem rising from the Atlantic (with clean navy halo separating it from the gold cross) -->
    <path
      d="M 146 136
         C 172 162, 206 164, 240 165
         C 276 167, 300 183, 316 218
         C 332 183, 356 167, 392 165
         C 426 164, 460 162, 486 136
         C 472 182, 434 218, 386 234
         C 356 244, 344 260, 344 292
         L 344 474
         C 344 477, 341 479, 338 479
         L 294 479
         C 291 479, 288 477, 288 474
         L 288 292
         C 288 260, 276 244, 246 234
         C 198 218, 160 182, 146 136 Z"
      fill="url(#whaleSeafoam)"
      stroke="#13294B"
      stroke-width="22"
      stroke-linejoin="round"
    />

    <!-- Crisp inner white/ivory fill pass so stroke is purely an outer halo -->
    <path
      d="M 146 136
         C 172 162, 206 164, 240 165
         C 276 167, 300 183, 316 218
         C 332 183, 356 167, 392 165
         C 426 164, 460 162, 486 136
         C 472 182, 434 218, 386 234
         C 356 244, 344 260, 344 292
         L 344 474
         C 344 477, 341 479, 338 479
         L 294 479
         C 291 479, 288 477, 288 474
         L 288 292
         C 288 260, 276 244, 246 234
         C 198 218, 160 182, 146 136 Z"
      fill="url(#whaleSeafoam)"
    />

    <!-- I E B H Wordmark (crisp geometric letterforms in Warm Ivory) -->
    <g fill="#FAF8F4">
      <!-- I -->
      <rect x="197" y="522" width="14" height="59" rx="2" />
      <!-- E -->
      <path d="M 239 522 H 282 V 533 H 253 V 546 H 279 V 556 H 253 V 570 H 282 V 581 H 239 Z" />
      <!-- B -->
      <path fill-rule="evenodd" d="M 308 522 H 336 C 348 522 355 528 355 537 C 355 544 351 548 345 550 C 353 552 357 557 357 565 C 357 575 349 581 337 581 H 308 Z M 322 532 V 546 H 334 C 339 546 342 543 342 539 C 342 535 339 532 334 532 Z M 322 556 V 571 H 335 C 341 571 344 568 344 563 C 344 559 341 556 335 556 Z" />
      <!-- H -->
      <path d="M 382 522 H 396 V 545 H 421 V 522 H 435 V 581 H 421 V 557 H 396 V 581 H 382 Z" />
    </g>
  </g>
</svg>
